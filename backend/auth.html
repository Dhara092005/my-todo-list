<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-container">

    <!-- Login Form -->
    <div id="login-form">
      <h2>Login</h2>
      <input type="text" id="login-username" placeholder="Username" /><br>
      <div class="password-wrapper">
        <input type="password" id="login-password" placeholder="Password" />
        <button
          type="button"
          class="toggle-password"
          id="login-password-toggle"
          onclick="togglePassword('login-password', 'login-password-toggle')"
          aria-label="Show password"
        >👁️</button>
      </div>
      <button onclick="login()">Login</button>

      <p class="link" onclick="toggleForm('forgot')">Forgot Password?</p>

      <hr>
      <p>Don't have an account?</p>
      <button onclick="toggleForm('signup')">Create Account / Signup</button>
    </div>

    <!-- Signup Form -->
    <div id="signup-form" style="display: none;">
      <h2>Create Account</h2>
      <input type="email" id="signup-email" placeholder="Email" /><br>
      <input type="text" id="signup-username" placeholder="Username" /><br>
      <div class="password-wrapper">
        <input type="password" id="signup-password" placeholder="Password" />
        <button
          type="button"
          class="toggle-password"
          id="signup-password-toggle"
          onclick="togglePassword('signup-password', 'signup-password-toggle')"
          aria-label="Show password"
        >👁️</button>
      </div>
      <div class="password-wrapper">
        <input type="password" id="signup-confirm" placeholder="Confirm Password" />
        <button
          type="button"
          class="toggle-password"
          id="signup-confirm-toggle"
          onclick="togglePassword('signup-confirm', 'signup-confirm-toggle')"
          aria-label="Show password"
        >👁️</button>
      </div>
      <button onclick="signup()">Signup</button>
      <hr>
      <p>Already have an account?</p>
      <button onclick="toggleForm('login')">Back to Login</button>
    </div>

    <!-- Forgot Password Form -->
    <div id="forgot-form" style="display: none;">
      <h2>Reset Password</h2>
      <input type="email" id="forgot-email" placeholder="Enter your email" /><br>
      <button id="forgot-submit" onclick="resetPassword()">Send Reset Link</button>
      <div id="forgot-status" class="status-message" aria-live="polite"></div>
      <hr>
      <p>Back to login?</p>
      <button onclick="toggleForm('login')">Back to Login</button>
    </div>

  </div>

  <script src="auth.js"></script>
</body>
</html>
