<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <h2>Reset Password</h2>
    <div id="invalid-token" style="display:none; color: red;">Invalid or expired token.</div>
    <div id="reset-form" style="display:none;">
      <input type="password" id="new-password" placeholder="New password" /><br>
      <input type="password" id="confirm-password" placeholder="Confirm password" /><br>
      <button id="submit-btn">Reset Password</button>
    </div>
    <div id="success-message" style="display:none; color:green;">Password reset successful. Redirecting to login...</div>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>
