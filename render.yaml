services:
  - type: web
    name: daymark-todo
    runtime: node
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://my-todo-list-3.onrender.com
      - key: MONGO_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
